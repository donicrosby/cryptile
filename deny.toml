# cargo-deny configuration.
# Policy: pull deps rather than hand-roll crypto/serialization; keep them
# within one major version (one minor while the major is 0); licenses FOSS only.

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 (Marvin Attack, rsa): unpatched upstream, no safe
  # upgrade exists. Accepted for a scoped reason: cryptile uses rsa ONLY to
  # unwrap the org key — one local decrypt against the user's own trusted
  # server per sync; no attacker-controlled timing oracle at our boundary.
  # Revisit when RustCrypto ships the constant-time rewrite.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # webpki-root-certs (reqwest/rustls root store) — permissive data license
  "CDLA-Permissive-2.0",
  # webauthn-authenticator-rs (CTAP2 hardware-key 2FA, `webauthn` feature):
  # MPL-2.0 is file-level copyleft — it binds only modifications to that
  # crate's own files, not to code that links it. Unmodified dependency,
  # USB+NFC transports only (no soft tokens); exact-pinned =0.5.5 per the
  # 0.x one-minor policy.
  "MPL-2.0",
]
# GPLv3 deliberately excluded: cryptile must never link bitwarden-sdk or any
# GPL crypto. Clean-room position documented in openspec/changes/add-foundation.

[bans]
# No vendored/duplicated crypto implementations; multiple versions are normal
# for transitive deps, so only fail on duplicates of security-relevant crates.
multiple-versions = "warn"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# github.com/donicrosby/fidoh — the owner's own cleanroom CTAP2.1 client
# stack (Apache-2.0), replacing the distrusted webauthn-authenticator-rs
# ceremony (openspec add-fidoh-ceremony-provider). This is the deliberate,
# recorded DEPENDENCY-POLICY deviation ("ecosystem crates over in-house"):
# fidoh is in-house BY DESIGN — a replacement, not a stealth build-out —
# because the grievances (unbounded keepalive loop, parallel-transport
# races, no FIDO-over-CCID) live in the replaced crate's design and cannot
# be fixed from outside. Rev-pinned in crates/vaultwarden/Cargo.toml;
# bumping the rev is a deliberate act. The git dep is off by default
# (`fidoh` cargo feature); hardware transports only — fidoh's soft-token
# transport is never enabled by a product feature.
allow-git = [
    "https://github.com/donicrosby/fidoh",
]
