# cargo-deny configuration.
# Policy: pull deps rather than hand-roll crypto/serialization; keep them
# within one major version (one minor while the major is 0); licenses FOSS only.

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 (Marvin Attack, rsa): unpatched upstream, no safe
  # upgrade exists. Accepted for a scoped reason: cryptile uses rsa ONLY to
  # unwrap the org key — one local decrypt against the user's own trusted
  # server per sync; no attacker-controlled timing oracle at our boundary.
  # Revisit when RustCrypto ships the constant-time rewrite.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # webpki-root-certs (reqwest/rustls root store) — permissive data license
  "CDLA-Permissive-2.0",
]
# GPLv3 deliberately excluded: cryptile must never link bitwarden-sdk or any
# GPL crypto. Clean-room position documented in openspec/changes/add-foundation.

[bans]
# No vendored/duplicated crypto implementations; multiple versions are normal
# for transitive deps, so only fail on duplicates of security-relevant crates.
multiple-versions = "warn"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
