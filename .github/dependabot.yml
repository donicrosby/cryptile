# Dependabot enforces the dependency-freshness policy from
# openspec/changes/add-foundation/design.md: stay within one major version of
# latest (one minor while the major is 0). Cargo updates land as PRs that CI
# (clippy + tests + cargo-deny) must approve.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # rsa (0.9.x) still consumes digest 0.10; sha1 0.11 needs digest 0.11.
      # Merging sha1 >= 0.11 yields two sha1/digest generations and breaks
      # Oaep::new::<sha1::Sha1>() in crates/vaultwarden. Revisit when rsa
      # releases a digest-0.11 generation.
      - dependency-name: "sha1"
        versions: [">=0.11"]
      # webauthn-authenticator-rs 0.6 turned WebauthnAuthenticator from a
      # struct into a trait — crates/vaultwarden/src/webauthn.rs is written
      # against the 0.5 API (exact-pinned =0.5.5 in the workspace manifest).
      # The crate is the distrusted legacy path being REPLACED by fidoh
      # (openspec add-fidoh-ceremony-provider, deny.toml rationale), so
      # porting webauthn.rs to the 0.6 API is wasted work on dead code.
      # Revisit only if fidoh is abandoned; 0.5.x patch bumps still flow.
      - dependency-name: "webauthn-authenticator-rs"
        versions: [">=0.6"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
