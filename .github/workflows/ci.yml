name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # decouple-pcsc-link: the default build links no pcsc library (exec-safe
      # on pcsclite-less hosts), so pcsclite headers leave the required gate.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Gate the exec-compatibility contract: the default binary must carry
      # no libpcsclite DT_NEEDED (scenario "exec-compat default binary").
      - run: |
          cargo build --release
          if ldd target/release/cryptile | grep -qi pcsclite; then
            echo "FAIL: default build links pcsclite — exec-unsafe" && exit 1
          fi
          ldd target/release/cryptile

  # add-fidoh-ceremony-provider: the featured-gate matrix. Additive only —
  # the default `check` job above is the required gate and stays unchanged.
  # The fidoh deps come from a git source allow-listed in deny.toml
  # (rev-pinned, see crates/vaultwarden/Cargo.toml).
  check-featured:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ["cryptile-vaultwarden/fidoh", "cryptile-vaultwarden/webauthn,fidoh", "cryptile-vaultwarden/fidoh-pcsc"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # pcsc-sys (fidoh-transport-pcsc, the fidoh-pcsc leg) and libudev-sys
      # (the legacy webauthn stack: webauthn-authenticator-rs -> fido-hid-rs
      # -> udev) build against system headers; the featured webauthn,fidoh
      # leg is the only CI job compiling the legacy USB path (default
      # features never pull it).
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features ${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace --features ${{ matrix.features }}

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
