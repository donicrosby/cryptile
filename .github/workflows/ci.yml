name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # default-fidoh-backend: the default build now embeds fidoh's
      # pcsc transport, so the CTAP2 system headers join the required gate.
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # add-fidoh-ceremony-provider: the featured-gate matrix. Additive only —
  # the default `check` job above is the required gate and stays unchanged.
  # The fidoh deps come from a git source allow-listed in deny.toml
  # (rev-pinned, see crates/vaultwarden/Cargo.toml).
  check-featured:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ["cryptile-vaultwarden/fidoh", "cryptile-vaultwarden/webauthn,fidoh"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # pcsc-sys (fidoh-transport-pcsc) and libudev-sys (the legacy
      # webauthn stack: webauthn-authenticator-rs -> fido-hid-rs -> udev)
      # build against system headers; the featured webauthn,fidoh leg is
      # the first CI job ever to compile the legacy USB path (default
      # features never pull it).
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features ${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace --features ${{ matrix.features }}

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
