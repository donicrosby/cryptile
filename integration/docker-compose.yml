# Cryptile live integration stack.
# Boots a disposable Vaultwarden for the live-fire test suite and for manual
# poking. Loopback-bound only; data is a named volume wiped by `down -v`.
#
#   docker compose -p cryptile-vw -f integration/docker-compose.yml up -d
#   docker compose -p cryptile-vw -f integration/docker-compose.yml down -v
#
services:
  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: cryptile-vw
    restart: unless-stopped
    environment:
      # Bootstrap needs open signups: provision.py registers the service
      # account through the public API. Loopback-bound throwaway; do not
      # expose this compose outside 127.0.0.1 with SIGNUPS_ALLOWED=true.
      SIGNUPS_ALLOWED: "true"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      WEB_VAULT_ENABLED: "true"
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: "80"
    ports:
      # Loopback by default. Containerized runners (e.g. an agent sandbox on
      # a docker bridge) set CRYPTILE_VW_BIND=0.0.0.0 and talk to the bridge
      # gateway instead of 127.0.0.1. Never leave 0.0.0.0 on an untrusted net.
      - "${CRYPTILE_VW_BIND:-127.0.0.1}:8222:80"
    volumes:
      - vw-data:/data

volumes:
  vw-data:
