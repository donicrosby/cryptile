[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/donicrosby/cryptile"

[workspace.dependencies]
cryptile-core = { path = "crates/core" }
clap = { version = "4", features = ["derive", "string"] }
secrecy = "0.10"

[profile.release]
lto = "thin"
strip = true
