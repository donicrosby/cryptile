[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/vaultwarden"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/donicrosby/cryptile"

[workspace.dependencies]
cryptile-core = { path = "crates/core" }
clap = { version = "4", features = ["derive", "string"] }
secrecy = "0.10"
argon2 = "0.6"
pbkdf2 = "0.13"
hkdf = "0.13"
sha2 = "0.11"
sha1 = "0.10"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.13"
rsa = { version = "0.9", features = ["sha1"] }
zeroize = "1.9"
subtle = "2.6"
base64 = "0.23"
rand_core = { version = "0.9", features = ["os_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
wiremock = "0.6"
