[package]
name = "cryptile-vaultwarden"
description = "Vaultwarden/Bitwarden Provider for cryptile: password-grant auth, zero-knowledge crypto, sync mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cryptile-core.workspace = true
argon2.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true
sha2.workspace = true
sha1.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
rsa.workspace = true
zeroize.workspace = true
subtle.workspace = true
base64.workspace = true
rand_core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
webauthn-authenticator-rs = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
# Hardware security-key second factor (provider 7). USB + NFC only, no soft
# tokens by policy: the point is a hardware root of trust.
webauthn = ["dep:webauthn-authenticator-rs", "dep:secrecy", "dep:tokio"]

[dev-dependencies]
wiremock.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
criterion = "0.8"

[[bench]]
name = "encstring"
harness = false
