[package]
name = "cryptile"
description = "One CLI, many secret backends: scoped machine access to Vaultwarden (and later 1Password, OpenBao) for agents and humans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cryptile"
path = "src/main.rs"

[dependencies]
cryptile-core.workspace = true
cryptile-vaultwarden.workspace = true
clap.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword.workspace = true

[features]
# default-fidoh-backend: plain `cargo build` / `cargo install`
# produces the fidoh-backed binary. Legacy escape hatch:
# --no-default-features --features webauthn
default = ["fidoh"]
# Passthrough: LEGACY CTAP2 stack (webauthn-authenticator-rs), escape
# hatch only. When both this and fidoh are on, the fidoh path wins.
webauthn = ["cryptile-vaultwarden/webauthn"]
# Passthrough: fidoh CTAP2 backend (typed PIN provider, UV
# pass-through). On by default (see `default` above); bare
# --no-default-features --features fidoh still works.
fidoh = ["cryptile-vaultwarden/fidoh"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
base64.workspace = true
wiremock.workspace = true
