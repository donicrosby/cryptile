[package]
name = "cryptile"
description = "One CLI, many secret backends: scoped machine access to Vaultwarden (and later 1Password, OpenBao) for agents and humans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cryptile"
path = "src/main.rs"

[dependencies]
cryptile-core.workspace = true
cryptile-vaultwarden.workspace = true
clap.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword.workspace = true

[features]
default = []
# Passthrough: builds the vaultwarden provider with hardware-key support.
webauthn = ["cryptile-vaultwarden/webauthn"]
# Passthrough: builds the vaultwarden provider with the fidoh CTAP2
# backend (typed PIN provider, UV pass-through). Off by default — the
# staged cutover of the *default* build is a separate change.
fidoh = ["cryptile-vaultwarden/fidoh"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
base64.workspace = true
wiremock.workspace = true
